  <g stroke="#8b93a1" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M125,162 L125,245"/>
    <path d="M325,162 L325,245"/>
    <path d="M525,162 L525,245"/>
    <path d="M330,335 L330,390"/>
    <path d="M725,162 L725,390"/>
    <path d="M925,162 L925,300 L1035,300 L1035,390"/>
    <path d="M1175,162 L1175,595"/>
    <path d="M1375,162 L1375,595"/>
