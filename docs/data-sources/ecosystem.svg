  </defs>

  <rect width="1420" height="700" fill="#0f1218" rx="14"/>
  <text x="710" y="40" text-anchor="middle" fill="#d0d6df" font-size="28" font-weight="700">Analytics Hub — Data Flow</text>

  <!-- Data sources -->
  <g fill="#213a63" stroke="#6d97cf" stroke-width="1.2">
    <rect x="40" y="80" width="170" height="82" rx="10"/>
    <rect x="240" y="80" width="170" height="82" rx="10"/>
    <rect x="440" y="80" width="170" height="82" rx="10"/>
    <rect x="640" y="80" width="170" height="82" rx="10"/>
    <rect x="840" y="80" width="170" height="82" rx="10"/>
    <rect x="1120" y="80" width="170" height="82" rx="10"/>
    <rect x="1240" y="80" width="170" height="82" rx="10"/>
  </g>
  <g fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">
