    <rect x="690" y="390" width="250" height="180" rx="10"/>
    <rect x="900" y="390" width="190" height="180" rx="10"/>
    <rect x="1040" y="595" width="170" height="70" rx="10"/>
    <rect x="1240" y="595" width="170" height="70" rx="10"/>
