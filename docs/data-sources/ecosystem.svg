  <g stroke="#66bfa3" stroke-width="0.5" opacity="0.45">
    <line x1="195" y1="435" x2="195" y2="555"/>
    <line x1="350" y1="435" x2="350" y2="555"/>
    <line x1="505" y1="435" x2="505" y2="555"/>
    <line x1="815" y1="435" x2="815" y2="555"/>
