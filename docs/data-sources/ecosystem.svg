    <text x="325" y="137">Usage exports</text>
    <text x="525" y="137">Users · groups · licenses</text>
    <text x="725" y="137">Behavioral data</text>
    <text x="925" y="137">Usage API + Members</text>
    <text x="1175" y="137">GH CLI + VS Code local history</text>
    <text x="1375" y="137">Cowork session history</text>
  </g>

  <!-- Scripts / export utilities -->
  <rect x="120" y="245" width="420" height="90" rx="10" fill="#5f4a18" stroke="#d3b066" stroke-width="1.2"/>
  <text x="330" y="278" text-anchor="middle" fill="#fff2cf" font-size="14" font-weight="700">Data Export Scripts &amp; Utilities</text>
  <text x="330" y="301" text-anchor="middle" fill="#f2deb1" font-size="11">Per-report scripts + PAX automation</text>

