    <text x="310" y="278" text-anchor="middle" fill="#F2C811" font-size="14" font-weight="700">Reports consuming Purview + Admin Center + Entra</text>
    <line x1="165" y1="290" x2="165" y2="410" stroke="#F2C811" stroke-width="0.5" opacity="0.35"/>
    <line x1="310" y1="290" x2="310" y2="410" stroke="#F2C811" stroke-width="0.5" opacity="0.35"/>
    <line x1="455" y1="290" x2="455" y2="410" stroke="#F2C811" stroke-width="0.5" opacity="0.35"/>
    <text x="92"  y="328" text-anchor="middle" fill="#ffe166" font-size="14" font-weight="700">AI-in-One</text>
