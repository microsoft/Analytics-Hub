    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect width="1500" height="700" fill="#eef1f5" rx="14"/>
  <text x="750" y="40" text-anchor="middle" fill="#3b4252" font-size="28" font-weight="700">Analytics Hub — Data Flow</text>

  <!-- Data sources -->
  <g fill="#213a63" stroke="#6d97cf" stroke-width="1.2">
    <rect x="40" y="80" width="170" height="82" rx="10"/>
    <rect x="240" y="80" width="170" height="82" rx="10"/>
    <rect x="440" y="80" width="170" height="82" rx="10"/>
    <rect x="640" y="80" width="170" height="82" rx="10"/>
    <rect x="840" y="80" width="170" height="82" rx="10"/>
    <rect x="1090" y="80" width="170" height="82" rx="10"/>
    <rect x="1290" y="80" width="170" height="82" rx="10"/>
  </g>
  <g fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">
    <text x="125" y="114">Microsoft Purview</text>
    <text x="325" y="114">Admin Center</text>
    <text x="525" y="114">Microsoft Entra ID</text>
    <text x="725" y="114">Viva Insights</text>
    <text x="925" y="114">GitHub Enterprise</text>
    <text x="1175" y="114">Coding Session Logs</text>
    <text x="1375" y="114">OneDrive Data</text>
  </g>
  <g fill="#c8daf5" font-size="11" text-anchor="middle">
