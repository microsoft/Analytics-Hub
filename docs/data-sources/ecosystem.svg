    <text x="805" y="420">Viva Insights reports</text>
    <text x="1035" y="420">GitHub report</text>
  </g>
  <g stroke="#66bfa3" stroke-width="0.5" opacity="0.45">
    <line x1="195" y1="435" x2="195" y2="555"/>
    <line x1="350" y1="435" x2="350" y2="555"/>
    <line x1="505" y1="435" x2="505" y2="555"/>
    <line x1="805" y1="435" x2="805" y2="555"/>
  </g>
  <g fill="#e8fff5" font-size="14" font-weight="700" text-anchor="middle">
    <text x="117" y="476">AI-in-One</text><text x="117" y="499">Dashboard</text>
    <text x="273" y="476">Chat &amp; Agent</text><text x="273" y="499">Intelligence</text>
    <text x="428" y="476">AI Business</text><text x="428" y="499">Value</text>
    <text x="583" y="476">M365 Usage</text><text x="583" y="499">Analytics</text>
    <text x="750" y="476">Superuser</text><text x="750" y="499">Adoption</text>
    <text x="860" y="476">Superuser</text><text x="860" y="499">Impact</text>
    <text x="1035" y="476">GitHub Copilot</text><text x="1035" y="499">Impact</text>
    <text x="1175" y="625" font-size="13">What I Did</text><text x="1175" y="646" font-size="11" fill="#b7ead8">(Copilot)</text>
    <text x="1375" y="625" font-size="13">What I Did with</text><text x="1375" y="646" font-size="13">Cowork</text>
  </g>

