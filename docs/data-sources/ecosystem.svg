    <text x="325" y="114">Admin Center</text>
    <text x="525" y="114">Microsoft Entra ID</text>
    <text x="725" y="114">Viva Insights</text>
    <text x="925" y="114">GitHub Enterprise</text>
    <text x="1205" y="114">Local Sessions</text>
