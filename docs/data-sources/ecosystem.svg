  <g fill="#1d4b3b" stroke="#66bfa3" stroke-width="1.2">
    <rect x="40" y="390" width="620" height="180" rx="10"/>
    <rect x="690" y="390" width="230" height="180" rx="10"/>
    <rect x="950" y="390" width="170" height="180" rx="10"/>
    <rect x="1090" y="595" width="170" height="70" rx="10"/>
    <rect x="1290" y="595" width="170" height="70" rx="10"/>
  </g>

  <g fill="#b7ead8" font-size="14" font-weight="700" text-anchor="middle">
