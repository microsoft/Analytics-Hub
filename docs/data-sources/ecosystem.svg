    <text x="237" y="328" text-anchor="middle" fill="#ffe166" font-size="14" font-weight="700">Chat &amp; Agent</text>
    <text x="237" y="350" text-anchor="middle" fill="#ffe166" font-size="14" font-weight="700">Intelligence</text>
    <text x="382" y="328" text-anchor="middle" fill="#ffe166" font-size="14" font-weight="700">AI Business</text>
    <text x="382" y="350" text-anchor="middle" fill="#ffe166" font-size="14" font-weight="700">Value</text>
    <text x="527" y="328" text-anchor="middle" fill="#ffe166" font-size="14" font-weight="700">M365 Usage</text>
    <text x="527" y="350" text-anchor="middle" fill="#ffe166" font-size="14" font-weight="700">Analytics</text>
  </g>

  <g>
    <rect x="620" y="250" width="280" height="170" rx="10" fill="#061310" stroke="#00B294" stroke-width="1.5"/>
    <text x="760" y="278" text-anchor="middle" fill="#00B294" font-size="14" font-weight="700">Viva Insights reports</text>
    <line x1="760" y1="290" x2="760" y2="410" stroke="#00B294" stroke-width="0.5" opacity="0.35"/>
    <text x="690" y="328" text-anchor="middle" fill="#55dcc0" font-size="14" font-weight="700">Superuser</text>
    <text x="690" y="350" text-anchor="middle" fill="#55dcc0" font-size="14" font-weight="700">Adoption</text>
    <text x="830" y="328" text-anchor="middle" fill="#55dcc0" font-size="14" font-weight="700">Superuser</text>
    <text x="830" y="350" text-anchor="middle" fill="#55dcc0" font-size="14" font-weight="700">Impact</text>
  </g>

  <g>
    <rect x="920" y="250" width="200" height="170" rx="10" fill="#060c1a" stroke="#4d8ef0" stroke-width="1.5"/>
    <text x="1020" y="278" text-anchor="middle" fill="#4d8ef0" font-size="14" font-weight="700">GitHub report</text>
    <text x="1020" y="336" text-anchor="middle" fill="#79aef5" font-size="14" font-weight="700">GitHub Copilot</text>
    <text x="1020" y="358" text-anchor="middle" fill="#79aef5" font-size="14" font-weight="700">Impact</text>
  </g>

  <!-- Personal outputs -->
  <g>
    <rect x="1030" y="500" width="170" height="80" rx="10" fill="#2b0f38" stroke="#d946ef" stroke-width="1.2"/>
    <text x="1115" y="533" text-anchor="middle" fill="#f1c9ff" font-size="13" font-weight="700">What I Did</text>
    <text x="1115" y="555" text-anchor="middle" fill="#cf95e1" font-size="11">(Copilot)</text>

    <rect x="1230" y="500" width="170" height="80" rx="10" fill="#34103f" stroke="#e879f9" stroke-width="1.2"/>
    <text x="1315" y="533" text-anchor="middle" fill="#f4d3ff" font-size="13" font-weight="700">What I Did with</text>
    <text x="1315" y="555" text-anchor="middle" fill="#f4d3ff" font-size="13" font-weight="700">Cowork</text>
  </g>

  <!-- Arrows -->
  <g stroke="#9aa4b2" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M110,150 L110,250"/>
    <path d="M310,150 L310,250"/>
    <path d="M510,150 L510,250"/>
    <path d="M710,150 L710,250"/>
    <path d="M910,150 L910,250"/>
    <path d="M1110,150 L1110,500"/>
    <path d="M1310,150 L1310,500"/>
