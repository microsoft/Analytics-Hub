<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 700" width="1420" height="700">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9aa4b2"/>
    </marker>
  </defs>

  <rect width="1420" height="700" fill="#0d1117" rx="14"/>
  <text x="710" y="38" text-anchor="middle" fill="#c9d1d9" font-size="30" font-weight="700">Analytics Hub — Data Flow</text>

  <!-- Source row -->
  <g>
    <rect x="20" y="70" width="180" height="80" rx="10" fill="#742774"/><text x="110" y="103" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Microsoft Purview</text><text x="110" y="125" text-anchor="middle" fill="#f5cff5" font-size="11">Audit logs</text>
    <rect x="220" y="70" width="180" height="80" rx="10" fill="#8f6b00"/><text x="310" y="103" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Admin Center</text><text x="310" y="125" text-anchor="middle" fill="#fde6a5" font-size="11">Usage exports</text>
    <rect x="420" y="70" width="180" height="80" rx="10" fill="#1f6feb"/><text x="510" y="103" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Microsoft Entra ID</text><text x="510" y="125" text-anchor="middle" fill="#cae3ff" font-size="11">Users · groups · licenses</text>

    <rect x="620" y="70" width="180" height="80" rx="10" fill="#00B294"/><text x="710" y="103" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Viva Insights</text><text x="710" y="125" text-anchor="middle" fill="#cff5ef" font-size="11">Behavioral data</text>
    <rect x="820" y="70" width="180" height="80" rx="10" fill="#1f6feb"/><text x="910" y="103" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">GitHub Enterprise</text><text x="910" y="125" text-anchor="middle" fill="#cae3ff" font-size="11">Usage API + Members</text>

    <rect x="1020" y="70" width="180" height="80" rx="10" fill="#7b2cbf"/><text x="1110" y="103" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Local Sessions</text><text x="1110" y="125" text-anchor="middle" fill="#efb0fa" font-size="11">VS Code local history</text>
    <rect x="1220" y="70" width="180" height="80" rx="10" fill="#9d4edd"/><text x="1310" y="103" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">OneDrive Data</text><text x="1310" y="125" text-anchor="middle" fill="#f2befa" font-size="11">Cowork session history</text>
