    <text x="273" y="476">Chat &amp; Agent</text><text x="273" y="499">Intelligence</text>
    <text x="428" y="476">AI Business</text><text x="428" y="499">Value</text>
    <text x="583" y="476">M365 Usage</text><text x="583" y="499">Analytics</text>
    <text x="752" y="476">Superuser</text><text x="752" y="499">Adoption</text>
    <text x="878" y="476">Superuser</text><text x="878" y="499">Impact</text>
    <text x="995" y="476">GitHub Copilot</text><text x="995" y="499">Impact</text>
    <text x="1125" y="625" font-size="13">What I Did</text><text x="1125" y="646" font-size="11" fill="#b7ead8">(Copilot)</text>
    <text x="1325" y="625" font-size="13">What I Did with</text><text x="1325" y="646" font-size="13">Cowork</text>
